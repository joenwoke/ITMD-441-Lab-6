<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
	<title>SunSet Dashboard</title>
</head>
	<body>
		<div class="app-wrapper">
      <header>
        <h1>Sun and Sunset Dashboard</h1>
        <p class="subtitle">Sunrise, Sunset, and Solar Stats</p>
        <div class="input-controls">
          <select id="locationSelect"></select>
          <button id="currentLocationBtn">Use My Location</button>
        </div>
        <p id="coordinates"></p>
      </header>

      <main>
        <section class="report-card" id="todayData">
          <h2>Today</h2>
          <div class="card-grid">
            <div class="card"><span class="label">🌅 Sunrise</span><span id="todaySunrise"></span></div>
            <div class="card"><span class="label">🌇 Sunset</span><span id="todaySunset"></span></div>
            <div class="card"><span class="label">🌤️ Dawn</span><span id="todayDawn"></span></div>
            <div class="card"><span class="label">🌙 Dusk</span><span id="todayDusk"></span></div>
            <div class="card"><span class="label">🕛 Noon</span><span id="todayNoon"></span></div>
            <div class="card"><span class="label">📏 Day Length</span><span id="todayLength"></span></div>
            <div class="card"><span class="label">🌍 Time Zone</span><span id="todayTimezone"></span></div>
          </div>
        </section>

        <section class="report-card" id="tomorrowData">
          <h2>Tomorrow</h2>
          <div class="card-grid">
            <div class="card"><span class="label">🌅 Sunrise</span><span id="tomorrowSunrise"></span></div>
            <div class="card"><span class="label">🌇 Sunset</span><span id="tomorrowSunset"></span></div>
            <div class="card"><span class="label">🌤️ Dawn</span><span id="tomorrowDawn"></span></div>
            <div class="card"><span class="label">🌙 Dusk</span><span id="tomorrowDusk"></span></div>
            <div class="card"><span class="label">🕛 Noon</span><span id="tomorrowNoon"></span></div>
            <div class="card"><span class="label">📏 Day Length</span><span id="tomorrowLength"></span></div>
            <div class="card"><span class="label">🌍 Time Zone</span><span id="tomorrowTimezone"></span></div>
          </div>
        </section>
      </main>

      <footer>
        <p>API by <a href="https://sunrisesunset.io/" target="_blank">SunriseSunset.io</a></p>
      </footer>
    </div>
    <script src="script.js"></script>
	</body>
</html>
